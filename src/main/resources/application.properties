# Server Port
server.port=8080

# PostgreSQL Veritaban? Ba?lant?s?
spring.datasource.url=jdbc:postgresql://localhost:5432/Defect Reverse-Tracker
spring.datasource.username=postgres
spring.datasource.password=filCeyda10?


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


app.seed.reset=false

# Yerel Gemini anahtarı (gite girmez). Yoksa asistan 503 döner, uygulama açılır.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.chat.include-thoughts=true

# Cursor MCP (Streamable HTTP) — POST http://localhost:8080/mcp
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=defect-tracker
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Çelik bobin hasar takip sistemi. Bobin analizi, açık saha dosyaları, dashboard istatistikleri ve hurda önerilen kuyruk kayıtlarını sorgular.
