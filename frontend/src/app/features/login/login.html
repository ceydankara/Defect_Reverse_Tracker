<div class="login-page">
  <div class="login-bg-shape login-bg-shape-a" aria-hidden="true"></div>
  <div class="login-bg-shape login-bg-shape-b" aria-hidden="true"></div>

  <div class="login-shell">
    <section class="login-hero">
      <div class="hero-inner">
        <div class="hero-badge">Steel Quality Platform</div>
        <h1>Defect Reverse-Tracker</h1>
      </div>
      <div class="hero-glow" aria-hidden="true"></div>
    </section>

    <section class="login-card">
      <div class="card-head">
        <div class="logo-mark" aria-hidden="true">
          <span></span>
        </div>
        <div>
          <h2>Giriş Yap</h2>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        @if (!backendOnline) {
          <div class="backend-warn">
            Sunucuya bağlanılamıyor. Backend servisinin çalıştığından emin olun.
          </div>
        }

        <div class="field">
          <label for="username">Kullanıcı Adı</label>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Kullanıcı adınız"
            autocomplete="username"
            [disabled]="loading"
          />
        </div>

        <div class="field">
          <label for="password">Şifre</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="loading"
          />
        </div>

        @if (errorMessage) {
          <div class="error">{{ errorMessage }}</div>
        }

        <button type="submit" class="submit-btn" [disabled]="loading">
          @if (loading) {
            <span class="spinner" aria-hidden="true"></span>
            Giriş yapılıyor...
          } @else {
            Giriş Yap
          }
        </button>
      </form>
    </section>
  </div>
</div>
